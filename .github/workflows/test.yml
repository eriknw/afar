name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes the runs for its previous pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip:
    name: pip (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Free-threaded 3.15 builds psutil, tornado, and PyYAML from source; do not fail on it yet
    continue-on-error: ${{ matrix.python-version == '3.15t' }}
    defaults:
      run:
        # GitHub's bash: `-eo pipefail`, and no login shell, which would reorder PATH on macOS
        shell: bash
    strategy:
      # One failing cell should not cancel the others.
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # Use a release candidate of a Python version that has no final release yet
          allow-prereleases: true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" coverage ipykernel ipywidgets nbconvert
          python -m pip check
      - name: PyTest
        run: |
          python -c 'import sys, afar, dask, distributed, innerscope; print(sys.version); print("afar", afar.__version__, "distributed", distributed.__version__, "innerscope", innerscope.__version__, innerscope.cfg.default_method)'
          # Test both of innerscope's methods, and without coverage too: coverage tools use
          # `sys.settrace` or `sys.monitoring`, which innerscope must work with, but not depend on.
          python -m pytest --color=yes --innerscope-method trace
          python -m pytest --color=yes --innerscope-method bytecode
          python -m coverage run -m pytest --color=yes
      - name: Notebook test
        run: |
          python -m jupyter nbconvert --to notebook --execute afar/tests/test_notebook.ipynb --output-dir "$RUNNER_TEMP"
      - name: Coverage
        run: |
          python -m coverage xml
          python -m coverage report --show-missing
      # act, which runs these workflows locally, sets ACT; GitHub does not.
      - name: Coveralls
        if: ${{ !env.ACT }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.xml
          flag-name: pip-${{ matrix.os }}-${{ matrix.python-version }}
          parallel: true

  conda:
    name: conda (${{ matrix.os }}, ${{ matrix.python-version }}, ${{ matrix.versions }} versions)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        # A login shell activates the conda environment; `-e` stops at the first failure
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        # conda-forge builds its noarch packages, innerscope among them, for Python 3.11 and
        # later, so the pip job alone tests 3.10.
        python-version: ["3.11", "3.15"]
        versions: ["latest"]
        include:
          # The floors in pyproject.toml, on the oldest Python conda-forge can install them on
          - os: ubuntu-latest
            python-version: "3.11"
            versions: minimum
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup conda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict
          activate-environment: afar
      - name: Install dependencies
        run: |
          # Keep these floors in sync with `dependencies` in pyproject.toml
          if [ "${{ matrix.versions }}" = "minimum" ]; then
            versions="distributed=2026.1.1 innerscope=0.8.0"
          else
            versions="distributed>=2026.1.1 innerscope>=0.8.0"
          fi
          conda install -y $versions pytest coverage ipython ipykernel ipywidgets nbconvert
          python -m pip install -e . --no-deps
          python -m pip check
      - name: PyTest
        run: |
          python -c 'import sys, afar, dask, distributed, innerscope; print(sys.version); print("afar", afar.__version__, "distributed", distributed.__version__, "innerscope", innerscope.__version__, innerscope.cfg.default_method)'
          python -m coverage run -m pytest --color=yes
      - name: Notebook test
        run: |
          python -m jupyter nbconvert --to notebook --execute afar/tests/test_notebook.ipynb --output-dir "$RUNNER_TEMP"
      - name: Coverage
        run: |
          python -m coverage xml
          python -m coverage report --show-missing
      - name: Coveralls
        if: ${{ !env.ACT }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.xml
          flag-name: conda-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.versions }}
          parallel: true

  finish:
    needs: [pip, conda]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls finished
        if: ${{ !env.ACT }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          parallel-finished: true

name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pip:
    name: pip (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Free-threaded 3.15 builds psutil, tornado, and PyYAML from source; do not fail on it yet
    continue-on-error: ${{ matrix.python-version == '3.15t' }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      # One failing cell should not cancel the others.
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Python 3.15 is a release candidate until 2026-10-09
          allow-prereleases: true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" coverage ipykernel ipywidgets nbconvert
      - name: PyTest
        run: |
          python -c 'import sys, afar, dask, distributed, innerscope; print(sys.version); print("afar", afar.__version__, "distributed", distributed.__version__, "innerscope", innerscope.__version__, innerscope.cfg.default_method)'
          # Test both of innerscope's methods, and without coverage too: coverage tools use
          # `sys.settrace` or `sys.monitoring`, which innerscope must work with, but not depend on.
          pytest --color=yes --innerscope-method trace
          pytest --color=yes --innerscope-method bytecode
          coverage run -m pytest --color=yes
      - name: Notebook test
        run: |
          jupyter nbconvert --to notebook --execute afar/tests/test_notebook.ipynb --output-dir "$RUNNER_TEMP"
      - name: Coverage
        run: |
          coverage xml
          coverage report --show-missing
      # act, which runs these workflows locally, sets ACT; GitHub does not.
      - name: Coveralls
        if: ${{ !env.ACT }}
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
          flag-name: pip-${{ matrix.os }}-${{ matrix.python-version }}
          parallel: true

  conda:
    name: conda (${{ matrix.os }}, ${{ matrix.python-version }}, ${{ matrix.versions }} versions)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.10", "3.14"]
        versions: ["latest"]
        include:
          # The floors in pyproject.toml
          - os: ubuntu-latest
            python-version: "3.10"
            versions: minimum
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict
          activate-environment: afar
      - name: Install dependencies
        run: |
          if [ "${{ matrix.versions }}" = "minimum" ]; then
            # Keep these in sync with `dependencies` in pyproject.toml
            versions="distributed=2021.12.0 innerscope=0.8.0"
          else
            versions="distributed innerscope"
          fi
          conda install -y $versions pytest coverage ipython ipykernel ipywidgets nbconvert
          pip install -e . --no-deps
      - name: PyTest
        run: |
          python -c 'import sys, afar, dask, distributed, innerscope; print(sys.version); print("afar", afar.__version__, "distributed", distributed.__version__, "innerscope", innerscope.__version__, innerscope.cfg.default_method)'
          coverage run -m pytest --color=yes
      - name: Notebook test
        run: |
          jupyter nbconvert --to notebook --execute afar/tests/test_notebook.ipynb --output-dir "$RUNNER_TEMP"
      - name: Coverage
        run: |
          coverage xml
          coverage report --show-missing
      - name: Coveralls
        if: ${{ !env.ACT }}
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
          flag-name: conda-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.versions }}
          parallel: true

  finish:
    needs: [pip, conda]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls finished
        if: ${{ !env.ACT }}
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
